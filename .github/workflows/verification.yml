name: Extended verification

# The slow tests and the longer studies. The code is deterministic, so they
# run when what they check changes, not on a clock, and can be started by
# hand before a release.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "crosschecks/**"
      - "accuracy/**"
      - "tests/**"
      - ".github/workflows/verification.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUNNER: &runner "ubuntu-24.04"
  TOOL_PYTHON_VERSION: "3.11"
  HATCH_VERSION: "1.18.2"
  UV_VERSION: "0.13.9"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  slow-tests:
    name: Slow tests
    runs-on: *runner
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true # zizmor: ignore[cache-poisoning] never runs for release tags

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.TOOL_PYTHON_VERSION }}

      - name: Install hatch
        run: uv tool install "hatch==$HATCH_VERSION"

      - name: Run the slow verification tier
        run: hatch test -vv --python "$TOOL_PYTHON_VERSION" --parallel -- -m slow

  literature:
    name: Literature comparisons
    runs-on: *runner
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true # zizmor: ignore[cache-poisoning] never runs for release tags

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.TOOL_PYTHON_VERSION }}

      - name: Install hatch
        run: uv tool install "hatch==$HATCH_VERSION"

      - name: Compare with published results
        run: hatch run accuracy:study literature_tables asymptotic_limits seidov eggleton --workers 2

  reduced-contract:
    name: Reduced contract run (reports, does not gate)
    runs-on: *runner
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true # zizmor: ignore[cache-poisoning] never runs for release tags

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.TOOL_PYTHON_VERSION }}

      - name: Install hatch
        run: uv tool install "hatch==$HATCH_VERSION"

      - name: Run every 25th job of every study
        run: hatch run accuracy:sample --every 25 --workers 4 --output sample-store

      - name: Upload the sample observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reduced-contract-store
          path: sample-store/
          if-no-files-found: ignore
