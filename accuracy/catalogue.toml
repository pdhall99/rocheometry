# Quantity catalogue: every public numerical quantity, and every check of it.
#
# One entry per quantity. `hatch run accuracy:report` and `accuracy:check`
# validate every reference here, and map the contract rows and diagnostics in
# accuracy/results/ to their entries.
#
# Each check column holds one of:
#   a list of references   the checks that fill the cell
#   "n/a: <reason>"        the column does not apply to this quantity
#   "gap: <note>"          the column applies and nothing fills it yet
# An empty list is not allowed: say n/a or gap.
#
# Columns:
#   structure    tests: exact identities, symmetries, by-construction properties
#   crosscheck   tests: agreement with an independent method on chosen cases
#   guard        tests: a contract bound on chosen cases, with a wide margin
#   fingerprint  tests: exact digests that change only when an output changes
#   literature   accuracy/literature/ modules (or tests that are really comparisons)
#   fit          fits/ folders of packaged fits the quantity is read from
#   timing       operations in speed/grid.py
# The contract and diagnostic rows come from the results of the recorded
# release run. A row belongs to the entry whose key is its name
# or a dotted prefix of it: `integrals.volume.radius` belongs to
# `integrals.volume`, and the identity check `integrals.mean_gravity.gauss_law`
# to `integrals.mean_gravity`. `promised` says whether the README or
# docs/site/guide/accuracy.md states a bound for the quantity; a promised quantity must
# have contract rows, and contract rows must be promised. `truth` names what the contract rows are measured against;
# `calibration` says how that truth is itself established:
#   independent       an independent method (high precision, exact field)
#   self-convergence  the same method at higher orders only
#   partial           self-convergence over the contract domain, plus an independent
#                     truth on part of it: a test, or accuracy/contract/independent_truth.py
#   n/a               no contract rows
# `calibration_refs` lists those independent checks. `shares` lists the
# Roche-specific library components an independent or partial truth still
# reuses, since a fault in one of them could hide from that truth. Each names
# `checked_by`, the tests that check the component against an independent
# truth, or "gap: <note>" when nothing does, and may add a `note` on how.
# The problem statement and the generic numerics (roots, Gauss-Legendre
# rules) may be shared freely.
# `questions` records checks whose placement the catalogue does not settle.

