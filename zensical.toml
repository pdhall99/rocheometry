[project]
site_url = "https://pdhall99.github.io/rocheometry"
site_name = "Rocheometry"
site_description = "Compute the equipotential geometry of binary systems in the classical Roche model"
site_author = "PD Hall"
copyright = "Copyright &copy; 2026 PD Hall"

repo_url = "https://github.com/pdhall99/rocheometry"
repo_name = "pdhall99/rocheometry"
edit_uri = "edit/main/docs/site/"

docs_dir = "docs/site"

nav = [
  { "Home" = "index.md" },

  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/installation.md",
    "getting-started/quickstart.md",
  ] },

  { "User guide" = [
    "guide/index.md",
    "guide/model.md",
    "guide/binaries-and-components.md",
    "guide/surfaces.md",
    "guide/sections-and-silhouettes.md",
    "guide/quadrature.md",
    "guide/potentials.md",
    "guide/accuracy.md",
  ] },

  { "Recipes" = [
    "recipes/index.md",
    "recipes/wilson-devinney-and-phoebe.md",
    "recipes/surface-gravity.md",
    "recipes/roche-lobe-diagram.md",
    "recipes/potential-diagram.md",
    "recipes/potential-well.md",
    "recipes/contour-map.md",
    "recipes/mesh.md",
    "recipes/temperature-map.md",
    "recipes/lobe-radii.md",
    "recipes/gravity-darkening.md",
    "recipes/l1-nozzle.md",
  ] },

  { "API reference" = [
    "api/index.md",
    "api/rocheometry.md",
    "api/svg.md",
    "api/matplotlib.md",
  ] },

  { "Project" = [
    "project/index.md",
    "project/changelog.md",
    "project/compatibility-and-versioning.md",
    "project/contributing.md",
    "project/license.md",
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/doctest-copy.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pdhall99"
name = "PD Hall on GitHub"

[project.theme]
