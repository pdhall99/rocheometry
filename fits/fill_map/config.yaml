# Fill map: the potential of a detached surface as a function of (qi, fill).
#
# Training samples are Lobatto nodes in the compact cube-root coordinate of qi
# and in s = sqrt(1 - fill). At each node Reference() inverts its volume for the
# potential and measures the fill that potential has, so the training pairs are
# exact to Reference accuracy and the build reads no packaged fit but the lobe
# radius.
qi_min: 1.0e-8
qi_max: 1.0e+8
qi_nodes: 49          # Lobatto nodes in qi^(1/3)/(1+qi^(1/3))
s_intervals: 25       # Lobatto intervals in sqrt(1 - fill); s >= 0.995 is skipped
qi_degree: 24         # Chebyshev degree in the compact fourth-root coordinate
s_degree: 14          # Chebyshev degree in 2 sqrt(1 - fill) - 1
reference:
  polar_order: 128
  azimuth_order: 64
accuracy_bound: 1.0e-6  # held-out relative potential and fill error
